# SmartClassroom T10 — self-contained Windows build check.
#
# Verifies the `smartclassroom/t10-token-pin` branch compiles and produces a
# runnable Sunshine (portable zip). Deliberately standalone — NO reusable
# workflows, NO secrets, NO `needs:` — so it is immune to the fork's
# reusable-workflow / secret drift that makes the upstream CI.yml fail at
# startup on this fork. Build steps mirror the upstream `build_win` job.
name: T10 Build Check

permissions:
  contents: read

on:
  push:
  workflow_dispatch:

jobs:
  build_windows:
    name: Windows Build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            wget

      - name: Install dependencies
        shell: msys2 {0}
        env:
          TOOLCHAIN: "ucrt-x86_64"
        run: |
          pacman -Syu --noconfirm \
            "git" \
            "mingw-w64-${TOOLCHAIN}-cmake" \
            "mingw-w64-${TOOLCHAIN}-cppwinrt" \
            "mingw-w64-${TOOLCHAIN}-curl-winssl" \
            "mingw-w64-${TOOLCHAIN}-gcc" \
            "mingw-w64-${TOOLCHAIN}-graphviz" \
            "mingw-w64-${TOOLCHAIN}-MinHook" \
            "mingw-w64-${TOOLCHAIN}-miniupnpc" \
            "mingw-w64-${TOOLCHAIN}-nlohmann-json" \
            "mingw-w64-${TOOLCHAIN}-nodejs" \
            "mingw-w64-${TOOLCHAIN}-nsis" \
            "mingw-w64-${TOOLCHAIN}-onevpl" \
            "mingw-w64-${TOOLCHAIN}-openssl" \
            "mingw-w64-${TOOLCHAIN}-opus" \
            "mingw-w64-${TOOLCHAIN}-toolchain"

      - name: Install Doxygen
        # CMake's find_package(Doxygen REQUIRED) gates configure on this.
        # GCC-compiled doxygen has graphviz issues, so use the official build.
        env:
          DOXYGEN_VERSION: "1.11.0"
        run: |
          $doxy_ver = $env:DOXYGEN_VERSION
          $_doxy_ver = $doxy_ver.Replace(".", "_")
          Invoke-WebRequest -Uri `
            "https://github.com/doxygen/doxygen/releases/download/Release_${_doxy_ver}/doxygen-${doxy_ver}-setup.exe" `
            -OutFile "doxygen-setup.exe"
          Start-Process `
            -FilePath .\doxygen-setup.exe `
            -ArgumentList '/VERYSILENT' `
            -Wait `
            -NoNewWindow
          Remove-Item -Path doxygen-setup.exe

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        shell: msys2 {0}
        run: |
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSUNSHINE_ASSETS_DIR=assets
          ninja -C build

      - name: Package portable ZIP
        shell: msys2 {0}
        run: |
          mkdir -p artifacts
          cd build
          cpack -G ZIP
          mv ./cpack_artifacts/Sunshine.zip ../artifacts/sunshine-windows-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-windows
          path: artifacts/
          if-no-files-found: error
